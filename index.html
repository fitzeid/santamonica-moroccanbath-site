<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MOROCCAN BATH @ Santa Monica KW</title>
<meta name="description" content="Royal Moroccan Hammam at Santa Monica Salon, Kuwait. The full traditional hammam experience — 1 hour, 15 KD. Book now.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@300;400;500;600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#000;
    --white:#fff;
    --smoke:rgba(255,255,255,.62);
    --line:rgba(255,255,255,.24);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Manrope',sans-serif;
    background:var(--black);
    color:var(--white);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  .hero{position:fixed;inset:0;overflow:hidden}
  .hero video{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    opacity:0;
    transition:opacity 1.4s ease;
  }
  .hero video.on{opacity:1}
  .veil{
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,.66) 0%, rgba(0,0,0,.10) 32%, rgba(0,0,0,.14) 52%, rgba(0,0,0,.88) 100%);
    pointer-events:none;
  }

  .ui{
    position:fixed;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:space-between;
    text-align:center;
    padding:calc(env(safe-area-inset-top) + 22px) 22px calc(env(safe-area-inset-bottom) + 20px);
  }

  .top{display:flex;flex-direction:column;align-items:center;gap:10px;animation:fade 1s .15s ease both}
  .top img{width:54px;height:auto}
  .top h1{
    font-family:'Marcellus',serif;
    font-weight:400;font-size:.92rem;
    letter-spacing:.46em;text-indent:.46em;
    text-transform:uppercase;
  }

  .foot{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;animation:fade 1s .45s ease both;margin-bottom:46px}
  .service{
    font-family:'Marcellus',serif;
    font-size:clamp(1.7rem,8vw,2.3rem);
    font-weight:400;line-height:1.1;
    text-transform:uppercase;
  }
  .service .at{
    display:block;
    font-size:.44em;
    text-transform:none;
    letter-spacing:.06em;
    margin-top:2px;
  }
  .service-sub{
    font-size:.72rem;font-weight:300;
    letter-spacing:.3em;text-indent:.3em;
    text-transform:uppercase;color:var(--smoke);
    margin-bottom:8px;
  }

  .opt{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;
    padding:17px 20px;
    text-decoration:none;
    transition:transform .15s ease, opacity .2s ease;
  }
  .opt:active{transform:scale(.98)}
  .opt:focus-visible{outline:2px solid var(--white);outline-offset:3px}
  .opt .l{text-align:start}
  .opt .name{font-size:.94rem;font-weight:600;letter-spacing:.04em}
  .opt .note{font-size:.72rem;font-weight:300;margin-top:2px}
  .opt .price{font-family:'Marcellus',serif;font-size:1.5rem;white-space:nowrap}
  .opt .price small{font-size:.6em;font-family:'Manrope',sans-serif;font-weight:400}

  .opt.single{
    border:1px solid var(--line);
    color:var(--white);
    background:rgba(0,0,0,.3);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
  }
  .opt.single .note{color:var(--smoke)}

  .opt.pack{
    background:var(--white);
    color:var(--black);
    position:relative;
  }
  .opt.pack .note{color:rgba(0,0,0,.6)}
  .save{
    position:absolute;
    top:-11px;inset-inline-end:14px;
    background:var(--black);
    color:var(--white);
    border:1px solid var(--white);
    font-size:.6rem;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;
    padding:4px 10px;border-radius:100px;
  }

  .wa{
    position:fixed;
    right:16px;
    bottom:calc(env(safe-area-inset-bottom) + 16px);
    display:flex;align-items:center;gap:8px;
    padding:10px 15px;
    border:1px solid rgba(255,255,255,.35);
    border-radius:100px;
    background:rgba(0,0,0,.4);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    color:var(--white);
    text-decoration:none;
    font-size:.64rem;font-weight:400;
    letter-spacing:.16em;text-transform:uppercase;
    z-index:5;
    animation:fade 1s .8s ease both;
  }
  .wa:active{opacity:.8}
  .wa svg{width:14px;height:14px;flex:none}

  .cities{
    margin-top:4px;
    font-size:.6rem;font-weight:300;
    letter-spacing:.44em;text-indent:.44em;
    text-transform:uppercase;color:var(--smoke);
  }

  .social{
    display:flex;gap:10px;justify-content:center;
    margin-top:10px;
  }
  .social a{
    width:38px;height:38px;border-radius:50%;
    border:1px solid rgba(255,255,255,.3);
    display:flex;align-items:center;justify-content:center;
    color:var(--white);
    background:rgba(0,0,0,.35);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    transition:opacity .2s ease, transform .15s ease;
  }
  .social a:active{transform:scale(.94);opacity:.8}
  .social svg{width:16px;height:16px;fill:currentColor}

  .lang{
    position:fixed;
    left:16px;
    top:calc(env(safe-area-inset-top) + 16px);
    z-index:6;
    animation:fade 1s .8s ease both;
  }
  .lang-btn{
    display:flex;align-items:center;gap:7px;
    padding:9px 14px;
    border:1px solid rgba(255,255,255,.35);
    border-radius:100px;
    background:rgba(0,0,0,.4);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    color:var(--white);
    font-family:'Manrope','Tajawal',sans-serif;
    font-size:.74rem;font-weight:500;
    cursor:pointer;
  }
  .lang-btn:active{opacity:.8}
  .lang-btn .chev{font-size:.55rem;opacity:.7;transition:transform .2s ease}
  .lang.open .lang-btn .chev{transform:rotate(180deg)}
  .lang-menu{
    position:absolute;left:0;top:calc(100% + 8px);
    min-width:100%;
    display:none;flex-direction:column;
    border:1px solid rgba(255,255,255,.28);
    border-radius:14px;overflow:hidden;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
  }
  .lang.open .lang-menu{display:flex}
  .lang-menu button{
    padding:11px 16px;
    background:none;border:none;
    color:var(--white);
    font-family:'Manrope','Tajawal',sans-serif;
    font-size:.8rem;font-weight:500;
    text-align:start;cursor:pointer;white-space:nowrap;
  }
  .lang-menu button:hover,.lang-menu button:focus-visible{background:rgba(255,255,255,.12)}
  .lang-menu button[aria-selected="true"]{opacity:.55}

  /* Arabic typography & direction fixes */
  html[lang="ar"] body{font-family:'Tajawal',sans-serif}
  html[lang="ar"] .top h1,
  html[lang="ar"] .service,
  html[lang="ar"] .price{font-family:'Tajawal',sans-serif;font-weight:500}
  html[lang="ar"] .top h1,
  html[lang="ar"] .service-sub,
  html[lang="ar"] .cities,
  html[lang="ar"] .save,
  html[lang="ar"] .wa{letter-spacing:0;text-indent:0}

  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .top,.foot,.wa{animation:none}
    .hero video{transition:none}
  }
</style>
</head>
<body>

<div class="hero" aria-hidden="true">

  <div class="veil"></div>

  <button class="lang-btn" id="langBtn" aria-haspopup="listbox" aria-expanded="false">
    <span id="langLabel">العربية</span><span class="chev" aria-hidden="true">▾</span>
  </button>
  <div class="lang-menu" id="langMenu" role="listbox" aria-label="Language">
    <button role="option" data-lang="en" lang="en">English</button>
    <button role="option" data-lang="ar" lang="ar">العربية</button>

</div>

<script>
(function(){
  var v = document.getElementById('heroVid');
  function start(){
    var p = v.play();
    if (p && p.catch) p.catch(function(){});
    v.classList.add('on');
  }
  if (v.readyState >= 3) start();
  else v.addEventListener('canplay', start, {once:true});
  document.addEventListener('touchstart', function t(){
    v.play().catch(function(){});
    document.removeEventListener('touchstart', t);
  }, {once:true});
})();

(function(){
  var I18N = {
    en: {
      docTitle: "MOROCCAN BATH @ Santa Monica KW",
      title: "Santa Monica KW",
      service: "Moroccan Bath",
      serviceAt: "@ Santa Monica",
      sub: "Steam · Scrub · Full-body glow",
      singleName: "Royal Moroccan Hammam",
      singleNote: "1 hour · full traditional ritual",
      singlePrice: "15 KD",
      cities: "Kuwait · Dubai",
      wa: "Contact us"
    },
    ar: {
      docTitle: "الحمام المغربي @ سانتا مونيكا الكويت",
      title: "سانتا مونيكا الكويت",
      service: "الحمام المغربي",
      serviceAt: "@ سانتا مونيكا",
      sub: "بخار · تقشير · توهّج كامل للجسم",
      singleName: "حمّام مغربي فاخر",
      singleNote: "ساعة وحدة · الطقس التقليدي الكامل",
      singlePrice: "١٥ د.ك",
      cities: "الكويت · دبي",
      wa: "تواصلي معنا"
    }
  };

  var wrap = document.getElementById('lang');
  var btn = document.getElementById('langBtn');
  var label = document.getElementById('langLabel');
  var menu = document.getElementById('langMenu');
  var options = menu.querySelectorAll('button[data-lang]');

  function setLang(l){
    var t = I18N[l] || I18N.en;
    document.documentElement.lang = l;
    document.documentElement.dir = (l === 'ar') ? 'rtl' : 'ltr';
    document.title = t.docTitle;
    var els = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < els.length; i++){
      var key = els[i].getAttribute('data-i18n');
      if (t[key] !== undefined) els[i].textContent = t[key];
    }
    label.textContent = (l === 'ar') ? 'English' : 'العربية';
    label.setAttribute('lang', (l === 'ar') ? 'en' : 'ar');
    for (var j = 0; j < options.length; j++){
      options[j].setAttribute('aria-selected', options[j].getAttribute('data-lang') === l ? 'true' : 'false');
    }
    try { localStorage.setItem('smk-lang', l); } catch(e){}
  }

  function closeMenu(){
    wrap.classList.remove('open');
    btn.setAttribute('aria-expanded', 'false');
  }

  btn.addEventListener('click', function(e){
    e.stopPropagation();
    var open = wrap.classList.toggle('open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  for (var k = 0; k < options.length; k++){
    options[k].addEventListener('click', function(){
      setLang(this.getAttribute('data-lang'));
      closeMenu();
    });
  }
  document.addEventListener('click', closeMenu);

  var saved = null;
  try { saved = localStorage.getItem('smk-lang'); } catch(e){}
  setLang(saved === 'ar' ? 'ar' : 'en');
})();
</script>
